<!DOCTYPE html>

<html lang="en">

<head>
    <meta name="author" content="Ayananta Paul">
    <meta name="description" content="page not found">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="./css/index.css" type="text/css">
    <link rel="icon" href="../assets/icons/page-not-found-logo.png" type="image/x-icon">
    <style>
        @font-face {
            font-family: 'myFont-regular';
            src: url('../assets/fonts/JetBrainsMonoNerdFont-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        :root {
            /* color */
            --link-color: #81C5F8;
            --link-active-color: #A371F7;
        }

        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            height: 100vh;
            /* 100% of the viewport height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Centers horizontally */
            align-items: center;
            /* Centers vertically */
            font-family: 'myFont-regular';
        }

        p {
            text-align: center;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
            padding-left: 7px;
            margin: auto 5px;
        }

        a:hover {
            text-decoration: underline;
        }

        a:active {
            text-decoration: underline;
            color: var(--link-active-color);
        }
    </style>
</head>

<body>
    <img src="../assets/icons/page-not-found-logo.png" alt="page-not-found-logo">
    <p>
        Page Not Found
        <br>
        <br>
        <a href="/">Go Back</a>
    </p>
</body>
